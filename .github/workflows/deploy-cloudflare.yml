name: Deploy Web to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norulo-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Norulo/norulo-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "a659b71fbdcc5e9023f24bd247b76933"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check production configuration
        run: npm run check:workers
      - name: Lint, test and build production assets
        run: npm run check
      - name: Validate Worker upload
        run: |
          npx --no-install wrangler --version
          npx --no-install wrangler deploy --dry-run --outdir work/cloudflare-deploy
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          fi
      - name: Verify existing production bindings and domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const base = "https://api.cloudflare.com/client/v4/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID;
          async function api(path) {
            const response = await fetch(base + path, {
              headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN },
              redirect: "error",
              signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 200, "Cloudflare preflight HTTP status");
            const body = await response.json();
            assert.equal(body.success, true, "Cloudflare preflight result");
            return body.result;
          }
          const live = await api("/workers/scripts/norulo-web/settings");
          assert.equal(config.name, "norulo-web");
          assert.equal(config.workers_dev, false);
          assert.equal(config.preview_urls, false);
          assert.equal(live.compatibility_date, config.compatibility_date);
          assert.deepEqual(live.compatibility_flags || [], config.compatibility_flags || []);
          assert.equal(live.bindings.filter(b => b.type === "assets" && b.name === "ASSETS").length, 1);
          const publicVars = Object.fromEntries(live.bindings.filter(b => b.type === "plain_text").map(b => [b.name, b.text]));
          assert.deepEqual(publicVars, config.vars, "Production public variables have drifted");
          const services = live.bindings.filter(b => b.type === "service").map(b => ({
            binding: b.name, service: b.service, ...(b.entrypoint ? { entrypoint: b.entrypoint } : {}),
          })).sort((a, b) => a.binding.localeCompare(b.binding));
          assert.deepEqual(services, [...config.services].sort((a, b) => a.binding.localeCompare(b.binding)));
          const domains = await api("/workers/domains?service=norulo-web");
          assert.deepEqual(domains.map(d => d.hostname).sort(), ["norulo.com", "www.norulo.com"]);
          assert.ok(domains.every(d => d.enabled !== false && d.previews_enabled === false));
          console.log("Existing production configuration verified.");
          NODE
      - name: Deploy production Web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy --keep-vars --message "Deploy Web main ${GITHUB_SHA}; GitHub Actions ${GITHUB_RUN_ID}"
      - name: Check APIs, deployed assets and readable public documents
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, readdirSync } from "node:fs";
          async function get(url) {
            return fetch(url, {
              redirect: "manual",
              signal: AbortSignal.timeout(30000),
              headers: { "User-Agent": "Mozilla/5.0 Norulo-Deployment-Check" },
            });
          }
          for (const url of ["https://api.norulo.com/health", "https://norulo.com/api/health"]) {
            const response = await get(url);
            assert.equal(response.status, 200, "Public API health status: " + url);
            assert.equal(response.headers.get("set-cookie"), null, "Anonymous health must not set cookies");
            const health = await response.json();
            assert.equal(health.ok, true);
            assert.equal(health.service, "norulo-server");
            assert.equal(health.database?.configured, true);
            console.log("PASS " + url);
          }
          const assetNames = readdirSync("dist/assets").filter(name => /^(index|plugins|catalog)-.+\.(js|css)$/.test(name));
          assert.ok(assetNames.length >= 3 && assetNames.length <= 16, "Expected bounded entry, plugin and locale assets");
          for (const name of assetNames) {
            const response = await get("https://norulo.com/assets/" + name);
            assert.equal(response.status, 200, "Deployed asset status: " + name);
            const actual = Buffer.from(await response.arrayBuffer());
            assert.ok(actual.equals(readFileSync("dist/assets/" + name)), "Deployed asset differs from this build: " + name);
            console.log("PASS byte-identical asset " + name);
          }
          for (const path of ["/", "/pricing", "/developers/docs", "/developers/api", "/plugins"]) {
            const document = await get("https://norulo.com" + path);
            assert.equal(document.status, 200, "Public document status: " + path);
            assert.equal(document.headers.get("cf-mitigated"), null, "Public document must not require a browser challenge");
            assert.equal(document.headers.get("set-cookie"), null, "Public document must not set cookies");
            const html = await document.text();
            const entry = assetNames.find(name => /^index-.+\.js$/.test(name));
            assert.ok(entry && html.includes("/assets/" + entry), "Document must reference this build's entry");
            assert.ok(html.includes('<main id="main-content"') && /<h1\b/.test(html), "Public body missing: " + path);
            assert.ok(html.includes('href="/pricing"') && html.includes('href="/plugins"'), "Public navigation missing: " + path);
            assert.ok(!html.includes('<div id="root"></div>'), "Empty public SPA shell: " + path);
            if (path === "/pricing") assert.ok(html.includes('aria-label="Current public plans"'), "Live public catalog unavailable");
            console.log("PASS readable public HTML " + path);
          }
          NODE
